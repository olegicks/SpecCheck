    <script>
      try {
        const t = localStorage.getItem('speccheck-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
